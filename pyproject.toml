[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hope-pytorch"
version = "0.1.0"
description = "PyTorch reproduction of HOPE: Hilbert Operator for Progressive Encoding (arXiv:2607.21366)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "torch-pruning>=1.5",
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
include = ["hope*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs pretrained weights or a dataset"]
